<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipes</title>
<style>
  :root {
    --bright: #ffffff;
    --text: #e6e6e6;
    --dim: #b4b4b4;
    --line: #6e6e6e;
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  html, body {
    margin: 0;
    background: #000;
    color: var(--text);
    font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 500;
    line-height: 1.25;
  }
  body { padding: 1rem 1.25rem 1.25rem; max-width: 100vw; overflow-x: hidden; }
  main { display: flex; flex-direction: column; gap: 0.75rem; min-height: calc(100vh - 2.25rem); }

  h1 {
    margin: 0;
    font-size: 1.625rem;
    font-weight: 600;
    color: var(--dim);
    letter-spacing: 0.02em;
  }

  button {
    font: inherit;
    font-size: 1.875rem;
    font-weight: 600;
    color: var(--text);
    background: #000;
    border: 0.125rem solid var(--line);
    border-radius: 0.875rem;
    padding: 0.75rem 1rem;
    margin: 0;
    text-align: left;
    width: 100%;
    overflow-wrap: anywhere;
    display: flex;
    align-items: center;
    gap: 0.625rem;
  }
  /* Focus is shown by a thicker, brighter outline, heavier text and a marker: not by hue. */
  button::before { content: ""; flex: none; width: 0.75rem; height: 0.75rem; border-radius: 50%; border: 0.125rem solid var(--line); }
  button:focus { outline: none; }
  button:focus, button:focus-visible {
    color: var(--bright);
    border-color: var(--bright);
    border-width: 0.25rem;
    padding: 0.625rem 0.875rem;
    font-weight: 800;
  }
  button:focus::before { background: var(--bright); border-color: var(--bright); }

  .label { display: flex; flex-direction: column; gap: 0.125rem; min-width: 0; }
  .meta { font-size: 1.625rem; font-weight: 500; color: var(--dim); }

  .choices { display: flex; flex-direction: column; gap: 0.75rem; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.25rem; }
  li { font-size: 1.8125rem; display: flex; justify-content: space-between; gap: 1rem; }
  li .amt { color: var(--bright); font-weight: 700; flex: none; }

  .step {
    margin: 0;
    font-size: 2.25rem;
    font-weight: 600;
    color: var(--bright);
    overflow-wrap: anywhere;
  }
  .spacer { flex: 1 1 auto; }
  .row { display: flex; gap: 0.75rem; }
  .row button { width: auto; flex: 1 1 0; }
  .row button.minor { flex: 0 1 auto; }
</style>
</head>
<body>
<main id="app"></main>

<script>
(function () {
  "use strict";

  // Sample data. Nothing is fetched.
  var RECIPES = [
    {
      name: "Tomato Pasta", time: "20 min",
      ingredients: [
        ["Spaghetti", "200 g"], ["Canned tomatoes", "400 g"], ["Garlic", "2 cloves"],
        ["Olive oil", "2 tbsp"], ["Basil", "6 leaves"], ["Salt", "1 tsp"]
      ],
      steps: [
        "Boil salted water. Cook spaghetti 9 minutes.",
        "Slice garlic. Fry in oil for 1 minute.",
        "Add tomatoes. Simmer 8 minutes.",
        "Drain pasta. Toss it in the sauce.",
        "Tear basil over the top. Serve."
      ]
    },
    {
      name: "Veggie Omelette", time: "10 min",
      ingredients: [
        ["Eggs", "3"], ["Bell pepper", "1/2"], ["Spinach", "1 handful"],
        ["Cheese", "30 g"], ["Butter", "1 tbsp"]
      ],
      steps: [
        "Dice the pepper. Beat the eggs with salt.",
        "Melt butter on medium heat.",
        "Fry pepper 2 minutes. Add spinach.",
        "Pour in eggs. Cook 2 minutes.",
        "Add cheese. Fold in half. Serve."
      ]
    },
    {
      name: "Banana Pancakes", time: "15 min",
      ingredients: [
        ["Banana", "1 ripe"], ["Eggs", "2"], ["Flour", "60 g"],
        ["Milk", "50 ml"], ["Butter", "1 tbsp"], ["Honey", "to serve"]
      ],
      steps: [
        "Mash the banana in a bowl.",
        "Whisk in eggs, flour and milk.",
        "Melt butter in a pan on medium.",
        "Pour 3 small rounds. Cook 2 minutes.",
        "Flip. Cook 1 more minute.",
        "Stack and drizzle with honey."
      ]
    }
  ];

  var app = document.getElementById("app");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function button(label, meta, onSelect, cls) {
    var b = el("button", cls || "");
    b.type = "button";
    var wrap = el("span", "label");
    wrap.appendChild(el("span", "", label));
    if (meta) wrap.appendChild(el("span", "meta", meta));
    b.appendChild(wrap);
    b.setAttribute("aria-label", meta ? label + ", " + meta : label);
    b.addEventListener("click", onSelect);
    return b;
  }

  // Routes: "" = recipe list, "#/r" = ingredients, "#/r/s" = step s (0-based).
  function parse() {
    var m = /^#\/(\d+)(?:\/(\d+))?$/.exec(location.hash);
    if (!m) return { view: "list" };
    var r = +m[1];
    if (!RECIPES[r]) return { view: "list" };
    if (m[2] == null) return { view: "ingredients", r: r };
    var s = Math.min(+m[2], RECIPES[r].steps.length - 1);
    return { view: "step", r: r, s: s };
  }

  // History stays at three entries at most: list, ingredients, step.
  // Moving between steps replaces the step entry instead of adding one.
  function go(hash, depth, replace) {
    var url = location.pathname + location.search + hash;
    if (replace) history.replaceState({ d: depth }, "", url);
    else history.pushState({ d: depth }, "", url);
    render();
  }

  function finish() {
    var d = history.state && history.state.d;
    if (d === 2) history.go(-2);          // popstate renders the list
    else go("", 0, true);
  }

  function render() {
    var route = parse();
    app.textContent = "";
    var first;

    if (route.view === "list") {
      document.title = "Recipes";
      app.appendChild(el("h1", "", "Recipes"));
      var box = el("div", "choices");
      RECIPES.forEach(function (rec, i) {
        var b = button(rec.name, rec.time + " · " + rec.steps.length + " steps", function () {
          go("#/" + i, 1, false);
        });
        if (i === 0) first = b;
        box.appendChild(b);
      });
      app.appendChild(box);
    } else if (route.view === "ingredients") {
      var rec = RECIPES[route.r];
      document.title = rec.name;
      app.appendChild(el("h1", "", rec.name));
      var ul = el("ul");
      rec.ingredients.forEach(function (ing) {
        var li = el("li");
        li.appendChild(el("span", "", ing[0]));
        li.appendChild(el("span", "amt", ing[1]));
        ul.appendChild(li);
      });
      app.appendChild(ul);
      app.appendChild(el("div", "spacer"));
      first = button("Start cooking", null, function () {
        go("#/" + route.r + "/0", 2, false);
      });
      app.appendChild(first);
    } else {
      var r = RECIPES[route.r], s = route.s, last = s === r.steps.length - 1;
      document.title = "Step " + (s + 1);
      app.appendChild(el("h1", "", "Step " + (s + 1) + "/" + r.steps.length));
      app.appendChild(el("p", "step", r.steps[s]));
      app.appendChild(el("div", "spacer"));
      var row = el("div", "row");
      if (s > 0) {
        row.appendChild(button("Previous", null, function () {
          go("#/" + route.r + "/" + (s - 1), history.state ? history.state.d : 0, true);
        }, "minor"));
      }
      first = button(last ? "Done" : "Next", null, function () {
        if (last) finish();
        else go("#/" + route.r + "/" + (s + 1), history.state ? history.state.d : 0, true);
      });
      row.appendChild(first);
      app.appendChild(row);
    }

    window.scrollTo(0, 0);
    if (first) first.focus();
  }

  window.addEventListener("popstate", render);
  if (!history.state) history.replaceState({ d: 0 }, "", location.href);
  render();
})();
</script>
</body>
</html>
