<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small text</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  main { box-sizing: border-box; height: 100%; padding: 32px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  h1 { margin: 0; font-size: 44px; font-weight: 700; }
  p { margin: 0; font-size: 28px; font-weight: 500; }
  button { font: inherit; color: #fff; background: #222; border: 2px solid #888; border-radius: 12px; padding: 2px 16px; }
  .meta { font-size: 12px; }
  .body { font-size: 18px; }
</style>
</head>
<body>
<main>
  <h1>12:40</h1>
  <p class="body">Tea, 3 minutes left</p>
  <button class="meta">Stop</button>
</main>
</body>
</html>
