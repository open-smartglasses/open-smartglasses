<!doctype html>
<meta charset="utf-8">
<title>tap list typed</title>
<script>
  // Sends what the Even Hub SDK sends to its host.
  const send = (method, data) =>
    window.flutter_inappwebview.callHandler('evenAppMessage', JSON.stringify({ type: 'call_even_app_method', method, data }));
  // What the SDK does with a host message: hands the app one envelope per event.
  const listen = handler => {
    window._listenEvenAppMessage = raw => {
      const [kind, data] = JSON.parse(raw).data;
      handler({ [kind]: data });
    };
  };
  send('createStartUpPageContainer', {"containerTotalNum": 1, "listObject": [{"xPosition": 0, "yPosition": 0, "width": 576, "height": 288, "containerID": 1, "containerName": "menu", "isEventCapture": 1, "itemContainer": {"itemCount": 2, "itemWidth": 560, "isItemSelectBorderEn": 1, "itemName": ["Start", "Stop"]}}]});
  // Opens the selected item only when the event names it.
  listen(event => {
    const list = event.listEvent;
    if (!list || list.eventType !== 0 || list.currentSelectItemIndex === undefined) return;
    send('rebuildPageContainer', {"containerTotalNum": 1, "textObject": [{"xPosition": 0, "yPosition": 0, "width": 576, "height": 288, "containerID": 2, "containerName": "open", "content": "Opened", "isEventCapture": 1}]});
  });
</script>
